[project]
name = "overture-matchers-monorepo"
version = "0.0.0"
requires-python = ">=3.11"

[tool.uv]
package = false
# uv 0.13.4 is the first release that distrusts the compromised emSign ECC
# Root CA - G3 (GHSA-hq85-5cpj-mr62). setup-uv and uv in packages/ both read this.
required-version = ">=0.13.4"

[dependency-groups]
dev = ["ruff==0.17.3"]

# Shared ruff config. Each package's pyproject.toml extends this file.
[tool.ruff.lint]
extend-select = [
    "I",  # isort
    "B",  # flake8-bugbear
    "UP", # pyupgrade
    "D",  # pydocstyle
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D", "F403"]
"**/conftest.py" = ["F401"]  # pytest finds fixtures through these imports, and ruff cannot see that they are used.

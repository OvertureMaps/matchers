# Discover Packages
#
# This workflow is shared by test_python.yml and publish_packages.yml so both
# agree on what a package is. Pushes and PRs consider the packages/ directories
# the diff touches, and workflow_dispatch considers all of them. A directory
# counts only if it has both pyproject.toml and tests/.

name: Discover Packages

on:
  workflow_call:
    outputs:
      packages:
        description: JSON array of package directory names (relative to packages/) for this event.
        value: ${{ jobs.detect-changes.outputs.packages }}

permissions: {}

jobs:
  detect-changes:
    name: detect-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    outputs:
      packages: ${{ steps.discover.outputs.packages }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find changed package directories
        id: changed-dirs
        if: github.event_name != 'workflow_dispatch'
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: packages/**
          files_ignore: packages/**/*.md
          dir_names: true
          dir_names_max_depth: 2
          json: true
          escape_json: false

      # A change to these workflows retests every package. Root ruff.toml is
      # left out because lint.yml already covers it.
      - name: Find changed package CI workflows
        id: ci-changed
        if: github.event_name != 'workflow_dispatch'
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            .github/workflows/test_python.yml
            .github/workflows/discover-packages.yml
            .github/workflows/publish_packages.yml

      - name: Discover packages
        id: discover
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CHANGED_DIRS: ${{ steps.changed-dirs.outputs.all_changed_files }}
          CI_CHANGED: ${{ steps.ci-changed.outputs.any_changed }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const isPackage = (name) =>
              fs.existsSync(path.join('packages', name, 'pyproject.toml')) &&
              fs.existsSync(path.join('packages', name, 'tests'));

            const candidates =
              context.eventName === 'workflow_dispatch' || process.env.CI_CHANGED === 'true'
                ? fs.readdirSync('packages', { withFileTypes: true })
                    .filter((entry) => entry.isDirectory())
                    .map((entry) => entry.name)
                : JSON.parse(process.env.CHANGED_DIRS || '[]')
                    .map((dir) => path.relative('packages', dir));

            const packages = candidates.filter(isPackage);
            core.info(`Discovered packages: ${JSON.stringify(packages)}`);
            core.setOutput('packages', JSON.stringify(packages));

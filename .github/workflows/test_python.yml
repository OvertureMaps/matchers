# Test Python Packages
#
# Tests each package under packages/ that the change touches (see
# discover-packages.yml). Each run syncs the locked environment, runs pytest,
# then builds the package and runs `twine check` in strict mode, so bad PyPI
# metadata fails the PR before it reaches a release. Java 17 is installed
# because the tests start a local SparkSession.

name: Test Python

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {} # no workflow-level access; each job grants only what it needs

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: detect-changes
    permissions:
      contents: read # forwarded to discover-packages.yml's checkout step
    uses: $/.github/workflows/discover-packages.yml

  test:
    name: test ${{ matrix.package }}
    needs: detect-changes
    if: needs.detect-changes.outputs.packages != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect-changes.outputs.packages) }}
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # setuptools_scm needs the tag history to resolve the version.
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: packages/${{ matrix.package }}/.python-version

      - name: Install Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # The local Spark session downloads the Sedona, GraphFrames and hadoop-aws
      # jars from Maven into ~/.ivy2 on first use. job.py is in the key because
      # it names the GraphFrames jar.
      - name: Cache Spark jars
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ivy2
          key: ivy-${{ matrix.package }}-${{ hashFiles(format('packages/{0}/uv.lock', matrix.package), format('packages/{0}/**/job.py', matrix.package)) }}
          restore-keys: ivy-${{ matrix.package }}-

      - name: Run tests
        run: uv run pytest -v --cov --cov-report=term-missing

      - name: Build package
        run: uv build

      - name: Check package metadata
        run: uvx twine check --strict dist/*

  # Branch protection should require this rollup job. A test job skipped
  # because no package changed counts as passing.
  rollup-python-test-status:
    name: rollup-python-test-status
    runs-on: ubuntu-latest
    # are-we-good reads job results from the needs context, so it needs no token scopes.
    permissions: {}
    needs:
      - detect-changes
      - test
    if: always()
    steps:
      - uses: lowlydba/are-we-good@6b10e5f2697555fbaf7f8f37ce38d4454c954a4c # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}

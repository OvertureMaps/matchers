# Test Python Packages
#
# Tests each package under packages/ that the change touches (see
# discover-packages.yml): `uv sync --locked`, `uv run pytest`, then
# `uv build` and `twine check --strict` so bad PyPI metadata fails the PR
# instead of a release after merge. Java 17 is installed because the tests
# start a local SparkSession. Adding a package needs no edits here.

name: Test Python

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {} # no workflow-level access; each job grants only what it needs

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: detect-changes
    permissions:
      contents: read # forwarded to discover-packages.yml's checkout step
    uses: $/.github/workflows/discover-packages.yml

  test:
    name: test ${{ matrix.package }}
    needs: detect-changes
    if: needs.detect-changes.outputs.packages != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect-changes.outputs.packages) }}
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # setuptools_scm needs tag history to resolve the version
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: packages/${{ matrix.package }}/.python-version

      - name: Install Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -v

      - name: Build package
        run: uv build

      - name: Check package metadata
        run: uvx twine check --strict dist/*

  # Rollup status job - require this in branch protection. A skipped test job
  # (no package touched) counts as passing.
  rollup-python-test-status:
    name: rollup-python-test-status
    runs-on: ubuntu-latest
    permissions: {} # are-we-good only reads job results from `needs` context
    needs:
      - detect-changes
      - test
    if: always()
    steps:
      - uses: lowlydba/are-we-good@6b10e5f2697555fbaf7f8f37ce38d4454c954a4c # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}

# This workflow lints the whole repo with the ruff pinned in the root pyproject.toml.

name: Lint

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ruff Format
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: "format --check"
          version-file: "pyproject.toml"
      - name: Ruff Check
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: "check"
          version-file: "pyproject.toml"

  # Branch protection should require this rollup job.
  rollup-lint-status:
    name: rollup-lint-status
    runs-on: ubuntu-latest
    # are-we-good reads job results from the needs context, so it needs no token scopes.
    permissions: {}
    needs:
      - python
    if: always()
    steps:
      - uses: lowlydba/are-we-good@6b10e5f2697555fbaf7f8f37ce38d4454c954a4c # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}

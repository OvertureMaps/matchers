# Publish Python Packages
#
# Auto-discovers packages the same way as test_python.yml (see
# discover-packages.yml). Three jobs per package, so the App key used to push
# release tags never shares a job with the build toolchain or PyPI upload:
#
# - release (push to main only): python-semantic-release inspects the
#   commits since the package's last release tag (attributing them by which
#   files they touched, via path_filters, not by a required commit scope)
#   and, if a release is warranted, pushes a `<package_dir>-v<version>` tag
#   and a GitHub Release. No version bump or changelog is committed back.
# - build (no secrets): on push, builds only if HEAD carries the package's
#   release tag, so a re-run also resumes a tagged-but-unpublished release.
#   Validates with `twine check --strict` and uploads dist/ as an artifact.
# - publish (id-token only): uploads that artifact by trusted publishing,
#   skipping versions already on the index.
#
# On workflow_dispatch: a pure smoke test. No tagging, no GitHub Release:
# every package builds from its current (unreleased) state and publishes to
# Test PyPI, so the pipeline can be exercised without touching main's
# release history or real PyPI.
#
# See PACKAGE_VERSIONING.md for the full flow and the one-time
# trusted-publisher setup (on both pypi.org and test.pypi.org) a new package
# needs.

name: Publish Python Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {} # no workflow-level access; each job grants only what it needs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # never cancel a release/publish mid-flight

jobs:
  # A workflow-only push discovers every package; path_filters make PSR a no-op.
  detect-changes:
    name: detect-changes
    permissions:
      contents: read # forwarded to discover-packages.yml's checkout step
    uses: $/.github/workflows/discover-packages.yml

  release:
    name: release ${{ matrix.package }}
    needs: detect-changes
    if: github.event_name == 'push' && needs.detect-changes.outputs.packages != '[]'
    runs-on: ubuntu-latest
    # No environment, so the OIDC subject is
    # repo:OvertureMaps/matchers:ref:refs/heads/main and the AWS role's trust
    # can later be narrowed to main.
    permissions:
      contents: read # checkout; the tag push uses the App token
      id-token: write # AWS OIDC
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect-changes.outputs.packages) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # uv 0.13.4 is the first release that no longer trusts the compromised
      # emSign ECC Root CA - G3 (GHSA-hq85-5cpj-mr62).
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ">=0.13.4"
          enable-cache: false # this workflow publishes a runtime artifact; don't risk a poisoned cache

      # The official Docker action resolves GitPython (an unpinned transitive
      # dependency) at image-build time, so every run picks up whatever
      # GitPython release is newest. GitPython v3.1.60 dropped the
      # `Actor.name_email_regex` class attribute that PSR v10.6.1 (latest as
      # of writing) still reads unconditionally, breaking config load for
      # every user of the action regardless of which PSR tag is pinned. The
      # fix is an open PR with no PSR release yet, so install PSR ourselves
      # as an isolated uv tool where we can pin GitPython below the broken
      # release. Revert to the Docker action once a fixed PSR version ships.
      # See: https://github.com/python-semantic-release/python-semantic-release/issues/1476
      - name: Install python-semantic-release
        run: uv tool install "python-semantic-release==10.6.1" --with "gitpython<3.1.60"

      # GITHUB_TOKEN can never be granted the `workflows` permission, so PSR's
      # tag push is rejected when the tagged commit's .github/workflows/
      # differs from every branch tip. overture-pull-requester has
      # contents:write and workflows:write, so mint a token from it instead.
      - name: Configure AWS credentials for pull-requester PEM
        # Narrow OIDC role that can only read this secret.
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::816069134238:role/gha-pull-requester-secrets-reader
          aws-region: us-west-2

      - name: Fetch pull-requester PEM from Secrets Manager
        uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: |
            PULL_REQUESTER_APP_PEM, omf-github-terraform/pull-requester/pem

      - name: Generate release push token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: Iv23liiN80WEARreTV7m # https://github.com/apps/overture-pull-requester
          private-key: ${{ env.PULL_REQUESTER_APP_PEM }} # zizmor: ignore[secrets-outside-env]
          owner: OvertureMaps
          repositories: matchers
          permission-contents: write
          permission-workflows: write

      # The token outlives these, so PSR and its dependencies never see the
      # App key or the credentials that can read it again.
      - name: Drop the App key and AWS credentials
        run: |
          {
            echo "PULL_REQUESTER_APP_PEM="
            echo "AWS_ACCESS_KEY_ID="
            echo "AWS_SECRET_ACCESS_KEY="
            echo "AWS_SESSION_TOKEN="
          } >> "$GITHUB_ENV"

      # Computes the next version from the commits since this package's last
      # release tag, attributing each commit to the package by its changed
      # files (see path_filters in the package's pyproject.toml), and, if a
      # release is warranted, tags and pushes it (no commit, no committed
      # changelog; release notes go to the GitHub Release instead). PSR
      # authenticates its own git push with GH_TOKEN, independent of the
      # checkout step's (deliberately non-persisted) credentials.
      - name: Release ${{ matrix.package }}
        working-directory: packages/${{ matrix.package }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          semantic-release -v version --no-commit --tag --push --no-changelog --vcs-release --skip-build

  build:
    name: build ${{ matrix.package }}
    needs: [detect-changes, release]
    # Runs after release whether it succeeded, failed or was skipped
    # (dispatch): the tag check below decides what to build.
    if: ${{ !cancelled() && needs.detect-changes.result == 'success' && needs.detect-changes.outputs.packages != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect-changes.outputs.packages) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags, including one release just pushed, for setuptools_scm
          persist-credentials: false

      # On push, build only a release tagged at HEAD. That covers both a
      # release made by this run and one a failed earlier run left unpublished.
      - name: Check for a release tag at HEAD
        id: should-build
        working-directory: packages/${{ matrix.package }}
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag_format=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['tool']['semantic_release']['tag_format'])")
          tag_prefix=$(printf '%s' "$tag_format" | sed 's/{version}.*//')
          if tag=$(git describe --tags --exact-match --match "${tag_prefix}*" HEAD 2>/dev/null); then
            echo "Building $tag."
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "HEAD has no release tag for this package; nothing to publish."
          fi

      - name: Install uv
        if: steps.should-build.outputs.build == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ">=0.13.4"
          enable-cache: false # this workflow publishes a runtime artifact; don't risk a poisoned cache

      - name: Build package
        if: steps.should-build.outputs.build == 'true'
        working-directory: packages/${{ matrix.package }}
        run: uv build

      # Twine's built-in check is what PyPI itself uses to validate metadata
      # (long_description rendering, required fields, valid classifiers) at
      # upload time; running it here fails the build early instead of
      # silently rejecting or mangling the package's PyPI page.
      - name: Check package metadata
        if: steps.should-build.outputs.build == 'true'
        working-directory: packages/${{ matrix.package }}
        run: uvx twine check --strict dist/*

      - name: Upload distributions
        if: steps.should-build.outputs.build == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.package }}
          path: packages/${{ matrix.package }}/dist/
          if-no-files-found: error
          overwrite: true # a re-run attempt replaces the earlier upload

  publish:
    name: publish ${{ matrix.package }}
    needs: [detect-changes, build]
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    environment:
      # workflow_dispatch never touches the real pypi-<package> environment
      # (and its trusted publisher scoped to pypi.org): it publishes under a
      # separate testpypi-<package> environment scoped to test.pypi.org.
      name: ${{ github.event_name == 'workflow_dispatch' && format('testpypi-{0}', matrix.package) || format('pypi-{0}', matrix.package) }}
    permissions:
      id-token: write # PyPI/TestPyPI trusted publishing
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect-changes.outputs.packages) }}
    steps:
      # A pattern that matches nothing downloads nothing, leaving dist/ empty
      # for packages with no release to publish.
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-${{ matrix.package }}
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        if: github.event_name == 'push' && hashFiles('dist/*') != ''
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true # a re-run after a partial upload

      - name: Publish to Test PyPI (smoke test)
        if: github.event_name == 'workflow_dispatch' && hashFiles('dist/*') != ''
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true # repeat dispatches on one commit build the same dev version

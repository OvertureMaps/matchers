---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "actions/*"
      docker:
        patterns:
          - "docker/*"
    labels:
      - "bot"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"

  - package-ecosystem: "uv"
    directories:
      - "/"
      - "/packages/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      python-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    labels:
      - "bot"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
    ignore:
      # This pin matches the Spark version in AWS Glue 5.0, so bump it only alongside a Glue upgrade.
      - dependency-name: "pyspark"

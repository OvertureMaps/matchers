---
version: 2
updates:
  # Maintain GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "actions/*"
      docker:
        patterns:
          - "docker/*"
    labels:
      - "bot"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"

  # Maintain uv-managed Python dependencies: the root ruff pin and each package.
  - package-ecosystem: "uv"
    directories:
      - "/"
      - "/packages/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      python-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    labels:
      - "bot"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
    ignore:
      # Pinned to the AWS Glue runtime's Spark; bump deliberately with Glue.
      - dependency-name: "pyspark"

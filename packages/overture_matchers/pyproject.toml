[project]
name = "overture-matchers"
dynamic = ["version"]
description = "Python matchers for conflating Overture Maps data: places, divisions, and addresses."
authors = [{ name = "Overture Maps Foundation" }]
license = "MIT"
# Vendored copy of the repo-root LICENSE: setuptools copies license-files
# sdist entries to the exact relative path given, so "../../LICENSE" lands
# outside the sdist root and PyPI rejects the upload. A package-local path
# is the only one that survives packaging.
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["overture", "overturemaps", "conflation", "spark"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
# PySpark is a dev dependency only: AWS Glue provides Spark at runtime.
dependencies = []

[project.urls]
Homepage = "https://github.com/OvertureMaps/matchers"
Source = "https://github.com/OvertureMaps/matchers/tree/main/packages/overture_matchers"
Issues = "https://github.com/OvertureMaps/matchers/issues"

[dependency-groups]
dev = [
    "pyspark==3.5.4",  # the AWS Glue 5.0 runtime
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=77.0.3", "setuptools_scm>=8.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["overture_matchers"]

[tool.setuptools_scm]
root = "../.."
tag_regex = "^overture_matchers-v(?P<version>[0-9].*)$"
git_describe_command = "git describe --dirty --tags --long --match 'overture_matchers-v*'"
# PyPI and Test PyPI reject local version identifiers (the "+g<hash>" suffix
# setuptools_scm appends between tags), so drop it. A real release always
# builds from a clean tag.
local_scheme = "no-local-version"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend = "../../ruff.toml"

[tool.semantic_release]
commit_parser = "conventional-monorepo"
tag_format = "overture_matchers-v{version}"
allow_zero_version = true

# path_filters (relative to this directory, since the release workflow cds
# here) is what attributes a commit to this package: PSR checks the commit's
# actual changed files, not its scope. No scope_prefix is set, so a plain
# `fix: ...`/`feat: ...` with no scope works. Only files that ship in the
# package count, so test-only changes and uv.lock bumps don't release.
[tool.semantic_release.commit_parser_options]
path_filters = ["overture_matchers", "pyproject.toml", "README.md", "LICENSE"]
# Without this, a conventional type outside minor_tags/patch_tags (docs,
# style, refactor, chore, build, ci, test) is parsed but contributes no
# bump, so a package can go multiple merges with no_release even though it
# changed. Floor every recognized type at a patch bump so any release-worthy
# push to this package always produces a new version.
# PSR 10.6.1's pydantic schema wants LevelBump's raw IntEnum value here, not
# the string name (a bare "patch" fails validation): 2 == LevelBump.PATCH.
default_bump_level = 2
